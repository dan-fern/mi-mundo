name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so the UI tests (main only, below) also catch slow breakage.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going. Runs on main
# are never cancelled, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Rust checks + iPad simulator build
    # Apple Silicon runner: the project only builds on arm64 Macs.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Pinned so a runner-image update can't change the toolchain under us.
      # Bump deliberately (and check the path exists on the image).
      XCODE_APP: /Applications/Xcode_16.4.app
    steps:
      - uses: actions/checkout@v4

      # Flag data vs the flag pictures. About 2 s (needs macOS `sips`), so it
      # goes first: a mismatch fails the run before the long steps start. It
      # rewrites FlagLayouts.json, which must come out identical to the commit.
      - name: Flag layouts match the pictures
        run: |
          python3 -I tools/check-flag-layouts.py
          git diff --exit-code -- apple/MiMundo/Resources/FlagLayouts.json

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # rustup is preinstalled; core/rust-toolchain.toml makes it install the
      # pinned Rust version and iOS targets on first use.
      # PR runs can only restore caches saved from main (or their own ref), so
      # only main saves: one shared cache instead of a dead one per PR.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets --features cli,mapgen -- -D warnings

      # --features mapgen also runs the map-data generator tests. Property
      # tests run 64 cases each on PRs and main to keep CI quick, and 256 in
      # the nightly run (256 is also the local default).
      - name: Rust tests
        working-directory: core
        env:
          PROPTEST_CASES: ${{ github.event_name == 'schedule' && '256' || '64' }}
        run: cargo test --features mapgen

      # The committed map data must be exactly what the tools produce from the
      # pinned, checksummed sources, so a change to mapgen / overrides can't
      # ship stale data. (Flags need Inkscape and are checked locally by
      # tools/build-data.sh instead.)
      - name: Committed map data matches the tools
        run: |
          RAW="$RUNNER_TEMP/raw"
          mkdir -p "$RAW/naturalearth"
          for layer in ne_110m_admin_0_countries ne_50m_admin_0_countries \
              ne_50m_rivers_lake_centerlines ne_50m_lakes \
              ne_50m_geography_regions_polys ne_50m_geography_regions_elevation_points; do
            curl -fsSL "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/$layer.geojson" \
              -o "$RAW/naturalearth/$layer.geojson"
          done
          (cd "$RAW" && grep naturalearth "$GITHUB_WORKSPACE/tools/data.sha256" | shasum -a 256 -c)
          (cd core && cargo run -q --features mapgen --bin mapgen -- \
            "$RAW/naturalearth/ne_110m_admin_0_countries.geojson" \
            "$RAW/naturalearth/ne_50m_admin_0_countries.geojson" \
            "$RUNNER_TEMP/World.bin")
          cmp "$RUNNER_TEMP/World.bin" apple/MiMundo/Resources/World.bin
          (cd core && cargo run -q --features mapgen --bin featuregen -- \
            "$RAW/naturalearth/ne_50m_rivers_lake_centerlines.geojson" \
            "$RAW/naturalearth/ne_50m_lakes.geojson" \
            "$RAW/naturalearth/ne_50m_geography_regions_polys.geojson" \
            "$RAW/naturalearth/ne_50m_geography_regions_elevation_points.geojson" \
            "$RUNNER_TEMP/Features.bin")
          cmp "$RUNNER_TEMP/Features.bin" apple/MiMundo/Resources/Features.bin
          python3 -I tools/build-countries.py \
            "$RAW/naturalearth/ne_50m_admin_0_countries.geojson" \
            tools/wikidata-facts.json tools/wikidata-landmarks.json tools/wikidata-capitals.json tools/facts-overrides.json \
            "$RUNNER_TEMP/Countries.json"
          cmp "$RUNNER_TEMP/Countries.json" apple/MiMundo/Resources/Countries.json

      # Same path as a fresh clone: builds the XCFramework, bindings and the
      # Xcode project from scratch.
      - name: Build Rust core
        run: ./scripts/build-core.sh

      - name: Build app for iPad simulator
        run: |
          xcodebuild build \
            -quiet \
            -project apple/MiMundo/MiMundo.xcodeproj \
            -scheme MiMundo \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath build/MiMundo.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Unit tests (migrations, answers, queue rules), hosted by the app in
      # an iPad simulator. Reuses the build products above.
      # Coverage is collected here and summarised below (no thresholds; the
      # trend is what we watch).
      - name: Swift tests on iPad simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if 'iPad' in d['name']))")
          xcodebuild test \
            -quiet \
            -project apple/MiMundo/MiMundo.xcodeproj \
            -scheme MiMundo \
            -destination "platform=iOS Simulator,id=$SIM" \
            -only-testing:MiMundoTests \
            -enableCodeCoverage YES \
            -resultBundlePath build/MiMundoTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Swift coverage summary
        run: |
          xcrun xccov view --report --only-targets build/MiMundoTests.xcresult > build/swift-coverage.txt
          xcrun xccov view --report --json build/MiMundoTests.xcresult > build/swift-coverage.json
          cat build/swift-coverage.txt
          # The app target's line, for the job summary.
          python3 -I - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          for t in json.load(open("build/swift-coverage.json"))["targets"]:
              if t["name"].startswith("MiMundo") and "Tests" not in t["name"]:
                  print(f"**Swift coverage (MiMundo.app, unit tests):** {t['lineCoverage']*100:.1f}% of lines ({t['coveredLines']}/{t['executableLines']})")
          PY

      - name: Upload Swift coverage
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: build/swift-coverage.*
          if-no-files-found: ignore

      # Three UI smoke flows (first run, play a country, freehand flag pad).
      # About 1.5 min locally, so likely 3+ on a runner: on main and nightly
      # only, not on every PR push, to keep PR CI near its ~10 minute budget.
      - name: UI tests on iPad simulator
        if: github.event_name != 'pull_request'
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if 'iPad' in d['name']))")
          xcodebuild test \
            -quiet \
            -project apple/MiMundo/MiMundo.xcodeproj \
            -scheme MiMundo \
            -destination "platform=iOS Simulator,id=$SIM" \
            -only-testing:MiMundoUITests \
            -resultBundlePath build/MiMundoUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/*.xcresult
          if-no-files-found: ignore

  # Rust coverage: main and nightly only (not PRs). Runs in parallel with the
  # build job, so it adds no wall-clock time. No thresholds.
  rust-coverage:
    name: Rust coverage
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false

      - name: Add llvm-tools
        working-directory: core
        run: rustup component add llvm-tools-preview

      # Downloads a prebuilt binary, so nothing to compile or cache.
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust coverage
        working-directory: core
        env:
          PROPTEST_CASES: ${{ github.event_name == 'schedule' && '256' || '64' }}
        run: |
          cargo llvm-cov --features mapgen --lcov --output-path ../rust-lcov.info
          cargo llvm-cov report --summary-only | tee ../rust-coverage.txt
          {
            echo -n "**Rust coverage (core):** "
            grep '^TOTAL' ../rust-coverage.txt | awk '{print $10 " of lines (" $8-$9 "/" $8 ")"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            rust-lcov.info
            rust-coverage.txt

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going. Runs on main
# are never cancelled, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Rust checks + iPad simulator build
    # Apple Silicon runner: the project only builds on arm64 Macs.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Pinned so a runner-image update can't change the toolchain under us.
      # Bump deliberately (and check the path exists on the image).
      XCODE_APP: /Applications/Xcode_16.4.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # rustup is preinstalled; core/rust-toolchain.toml makes it install the
      # pinned Rust version and iOS targets on first use.
      # PR runs can only restore caches saved from main (or their own ref), so
      # only main saves: one shared cache instead of a dead one per PR.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets --features cli,mapgen -- -D warnings

      # --features mapgen also runs the map-data generator tests. Property
      # tests run 64 cases each here (256 locally) to keep CI quick.
      - name: Rust tests
        working-directory: core
        env:
          PROPTEST_CASES: "64"
        run: cargo test --features mapgen

      # The committed map data must be exactly what the tools produce from the
      # pinned, checksummed sources, so a change to mapgen / overrides can't
      # ship stale data. (Flags need Inkscape and are checked locally by
      # tools/build-data.sh instead.)
      - name: Committed map data matches the tools
        run: |
          RAW="$RUNNER_TEMP/raw"
          mkdir -p "$RAW/naturalearth"
          for layer in ne_110m_admin_0_countries ne_50m_admin_0_countries \
              ne_50m_rivers_lake_centerlines ne_50m_lakes \
              ne_50m_geography_regions_polys ne_50m_geography_regions_elevation_points; do
            curl -fsSL "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/$layer.geojson" \
              -o "$RAW/naturalearth/$layer.geojson"
          done
          (cd "$RAW" && grep naturalearth "$GITHUB_WORKSPACE/tools/data.sha256" | shasum -a 256 -c)
          (cd core && cargo run -q --features mapgen --bin mapgen -- \
            "$RAW/naturalearth/ne_110m_admin_0_countries.geojson" \
            "$RAW/naturalearth/ne_50m_admin_0_countries.geojson" \
            "$RUNNER_TEMP/World.bin")
          cmp "$RUNNER_TEMP/World.bin" apple/MiMundo/Resources/World.bin
          (cd core && cargo run -q --features mapgen --bin featuregen -- \
            "$RAW/naturalearth/ne_50m_rivers_lake_centerlines.geojson" \
            "$RAW/naturalearth/ne_50m_lakes.geojson" \
            "$RAW/naturalearth/ne_50m_geography_regions_polys.geojson" \
            "$RAW/naturalearth/ne_50m_geography_regions_elevation_points.geojson" \
            "$RUNNER_TEMP/Features.bin")
          cmp "$RUNNER_TEMP/Features.bin" apple/MiMundo/Resources/Features.bin
          python3 -I tools/build-countries.py \
            "$RAW/naturalearth/ne_50m_admin_0_countries.geojson" \
            tools/wikidata-facts.json tools/wikidata-landmarks.json tools/wikidata-capitals.json tools/facts-overrides.json \
            "$RUNNER_TEMP/Countries.json"
          cmp "$RUNNER_TEMP/Countries.json" apple/MiMundo/Resources/Countries.json

      # Same path as a fresh clone: builds the XCFramework, bindings and the
      # Xcode project from scratch.
      - name: Build Rust core
        run: ./scripts/build-core.sh

      - name: Build app for iPad simulator
        run: |
          xcodebuild build \
            -quiet \
            -project apple/MiMundo/MiMundo.xcodeproj \
            -scheme MiMundo \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath build/MiMundo.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/MiMundo.xcresult
          if-no-files-found: ignore

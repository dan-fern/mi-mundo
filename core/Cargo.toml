[package]
name = "mimundo_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Game logic for Mi Mundo, shared with the SwiftUI app through UniFFI."

[lib]
# staticlib: linked into the iPad app.
# cdylib: used on the Mac to generate the Swift bindings.
# lib: used by Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Only the Mac-side bindings generator needs UniFFI's CLI. Keeping it out of
# the default build keeps clap/askama/bindgen out of the iPad static library
# (~20 MB instead of ~80 MB).
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
uniffi = "0.32.2"

[profile.release]
lto = true
strip = true

# XcodeGen spec. MiMundo.xcodeproj is generated from this file
# (scripts/build-core.sh runs `xcodegen generate`); edit this, not the project.
name: MiMundo
options:
  bundleIdPrefix: com.danfern
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Signing team lives in Config/Local.xcconfig (gitignored), included from
# Config/Base.xcconfig, so regenerating the project never loses it.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  MiMundoCore:
    path: ../MiMundoCore

targets:
  MiMundo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MiMundoCore
    # Safety net: the scheme pre-action below rebuilds the Rust core and fails
    # the build if that fails, but older Xcodes ignore pre-action failures.
    # This stops the build with a clear error rather than running an app
    # built against stale Rust.
    preBuildScripts:
      - name: Check Rust core is up to date
        script: |
          FLAG=""
          if [ "$CONFIGURATION" = "Release" ]; then FLAG="--release"; fi
          "$SRCROOT/../../scripts/build-core.sh" --check $FLAG
        basedOnDependencyAnalysis: false
    settings:
      base:
        # The check above reads files under core/, outside the target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.danfern.mimundo
        PRODUCT_NAME: MiMundo
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        # The Rust core is only built for Apple Silicon simulators.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        # Generated Info.plist, merged with Info.plist below. The scene
        # manifest lives there so we can turn multi-window off: one window
        # means one copy of the child's quiz and streak state.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mi Mundo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

schemes:
  MiMundo:
    build:
      targets:
        MiMundo: all
      # Runs before anything is built (including the MiMundoCore package),
      # so Swift always compiles against fresh bindings. Output goes to
      # apple/MiMundo/build/rust-core.log. `env -i` keeps Xcode's iOS build
      # variables (SDKROOT etc.) from leaking into cargo's Mac-side build;
      # DEVELOPER_DIR is passed through so the script uses the same Xcode
      # that's running this build, not whatever xcode-select points at.
      preActions:
        - name: Rebuild Rust core if needed
          settingsTarget: MiMundo
          script: |
            LOG="$PROJECT_DIR/build/rust-core.log"
            mkdir -p "$PROJECT_DIR/build"
            FLAG=""
            if [ "$CONFIGURATION" = "Release" ]; then FLAG="--release"; fi
            if ! env -i HOME="$HOME" USER="$USER" DEVELOPER_DIR="$DEVELOPER_DIR" \
              PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
              "$PROJECT_DIR/../../scripts/build-core.sh" --if-stale --no-project $FLAG \
              > "$LOG" 2>&1; then
              echo "error: Rust core build failed (full log: $LOG):" >&2
              tail -n 25 "$LOG" >&2
              exit 1
            fi
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
